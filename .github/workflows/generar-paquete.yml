# Project Gina: pruebas automáticas y paquete para las tiendas.
# - En cada push o pull request que toque la extensión, los datos o las pruebas: regenera y corre las pruebas.
# - Al ejecutarlo a mano (Actions → «Run workflow»): además arma el zip con la versión del manifest
#   y, si la base cambió de verdad (no solo la fecha), abre un PR «build: regenerar base» (nunca push directo a main).
# - Al empujar una etiqueta vX.Y.Z (igual a la versión del manifest): crea un Release con el zip.
name: Project Gina — pruebas y paquete

on:
  push:
    branches: [main]
    paths: ["extension/**", "datagen/**", "job/**", "test/**", ".github/workflows/**"]
    tags: ["v*"]
  pull_request:
    paths: ["extension/**", "datagen/**", "job/**", "test/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      guardar_base:
        description: "Subir al repositorio la base regenerada si cambió"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  pruebas-y-paquete:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Misma cola que el robot: nunca publican la base al mismo tiempo.
    concurrency:
      group: gina-investigacion
      cancel-in-progress: false
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Completar aprobado_en_pr tras fusionar PR de datos
        id: pr_merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import csv, os, re, subprocess
          msg = subprocess.check_output(["git", "log", "-1", "--pretty=%B"], text=True)
          m = re.search(r"(?:Merge pull request #|#)([0-9]+)", msg)
          pr_num = m.group(1) if m else ""
          if not pr_num:
              try:
                  sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
                  out = subprocess.check_output(["gh", "pr", "list", "--state", "merged", "--search", sha, "--json", "number", "--jq", ".[0].number"], text=True).strip()
                  if out.isdigit():
                      pr_num = out
              except Exception:
                  pass
          ev_path = "datagen/evidencias.csv"
          updated = 0
          if pr_num and os.path.exists(ev_path):
              with open(ev_path, encoding="utf-8") as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  rows = list(reader)
              for r in rows:
                  val = (r.get("aprobado_en_pr") or "").strip()
                  if val.startswith("datos/"):
                      r["aprobado_en_pr"] = f"#{pr_num}"
                      updated = 1
              if updated:
                  with open(ev_path, "w", encoding="utf-8", newline="") as f:
                      writer = csv.DictWriter(f, fieldnames=fieldnames, quoting=csv.QUOTE_ALL)
                      writer.writeheader()
                      writer.writerows(rows)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"updated={updated}\n")
          EOF

      - name: Regenerar base, sitios, manifest y traducciones
        run: python3 datagen/build_data.py

      - name: Construir índice FTS5 de biblioteca de fuentes
        run: python3 datagen/indice_fuentes.py --no-sync

      - name: Instalar dependencias de las pruebas
        run: cd test && npm ci --no-audit --no-fund

      - name: Pruebas de la extensión (matcher, tarjeta, extractores…)
        run: node test/run.js

      - name: Pruebas del background y del robot
        run: |
          node test/background.test.js
          node test/job.test.js
          node test/e2e_ciclo.test.js
          node test/snapshots.test.js
          node test/seguridad.test.js
          node test/sugerencias_gs.test.js
          node test/sugerencias_robot.test.js

      - name: Leer versiones
        id: v
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          BASE=$(node -p "require('./extension/data/brands.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Extensión $VERSION · base $BASE"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión del manifest ($VERSION)"; exit 1
          fi

      - name: ¿La base cambió de verdad? (sin contar la fecha de versión)
        id: cambios
        run: |
          node -e '
            const { execSync } = require("child_process"), fs = require("fs");
            const files = ["extension/data/brands.json", "extension/data/sites.json"];
            const sinVersion = (t) => { const o = JSON.parse(t); delete o.version; return JSON.stringify(o); };
            const cambio = files.some((f) => {
              let antes = "";
              try { antes = execSync(`git show HEAD:${f}`, { maxBuffer: 1e9 }).toString(); } catch (e) { return true; }
              return sinVersion(antes) !== sinVersion(fs.readFileSync(f, "utf8"));
            });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `real=${cambio ? 1 : 0}\n`);
            console.log(cambio ? "La base cambió." : "Solo cambió la fecha: se conserva la base del repositorio.");
          '
          git add -A extension
          if ! git diff --cached --quiet -- extension ':!extension/data'; then echo "manifest=1" >> "$GITHUB_OUTPUT"; fi
          git reset -q

      - name: Conservar la base del repositorio si solo cambió la fecha
        if: steps.cambios.outputs.real == '0' && steps.pr_merge.outputs.updated != '1'
        run: git checkout -- extension/data

      - name: Crear zip para las tiendas
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        id: zip
        run: |
          mkdir -p dist
          ZIP="gina-extension-${{ steps.v.outputs.version }}.zip"
          (cd extension && zip -r -X "../dist/$ZIP" . -x "README.md" -x "*.DS_Store")
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256")
          echo "zip=dist/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Guardar paquete como artefacto de descarga
        if: steps.zip.outputs.zip
        uses: actions/upload-artifact@v4
        with:
          name: gina-extension-${{ steps.v.outputs.version }}
          path: |
            ${{ steps.zip.outputs.zip }}
            ${{ steps.zip.outputs.zip }}.sha256
          retention-days: 90

      - name: Proponer la base regenerada por PR (nunca push directo a main)
        if: ((github.event_name == 'workflow_dispatch' && inputs.guardar_base) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (steps.cambios.outputs.real == '1' || steps.cambios.outputs.manifest == '1' || steps.pr_merge.outputs.updated == '1')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "gina-bot"
          git config user.email "gina-bot@users.noreply.github.com"
          git add extension docs store datagen/evidencias.csv
          if git diff --cached --quiet; then echo "Sin cambios que proponer."; exit 0; fi
          RAMA="build/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$RAMA"
          git commit -m "build: regenerar base ${{ steps.v.outputs.base }} (paquete ${{ steps.v.outputs.version }})"
          git push origin "$RAMA"
          gh pr create --base main --head "$RAMA" \
            --title "build: regenerar base ${{ steps.v.outputs.base }}" \
            --body "Base y archivos generados por el flujo «pruebas y paquete» (incluye aprobado_en_pr de evidencias tras fusionar un PR de datos). Revisar y fusionar."

      - name: Crear Release con el zip
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.zip }}" "${{ steps.zip.outputs.zip }}.sha256" \
            --title "Gina ${{ steps.v.outputs.version }}" \
            --notes "Paquete para Chrome Web Store, Edge Add-ons y Firefox AMO. Base de datos ${{ steps.v.outputs.base }}. Ver PUBLICAR.md."

