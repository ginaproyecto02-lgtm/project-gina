# Project Gina: investiga periódicamente con verificación determinista y abre un Pull Request para revisión humana.
# Configura en GitHub → Settings → Secrets and variables → Actions:
#   Secreto  GINA_API_KEY          = clave del proveedor de investigación (Anthropic, Gemini, …)
#   Secreto  GINA_SAFEBROWSING_KEY = clave de Google Safe Browsing Lookup API v4 (opcional)
#   Secreto  GINA_FACTCHECK_KEY    = clave de Google Fact Check Tools API (opcional)
#   Variable GINA_PROVIDER         = anthropic | gemini | groq | xai | openai (por defecto: anthropic)
#   Variable GINA_MODEL            = modelo económico de investigación
#   Variable GINA_EVERY_DAYS       = días mínimos entre ejecuciones reales (6 por defecto: corre cada lunes)
#   Variable GINA_REVALIDATE       = evidencias a revalidar por ejecución (5 por defecto)
#   Variable GINA_URL_CHECK        = safebrowsing | webrisk
#   Variable GINA_SITIOS           = marcas por ejecución para buscar sitio oficial y buscador (50 por defecto; 0 = apagado)
#   Secreto  GINA_IMAP_USER / GINA_IMAP_PASS = buzón de sugerencias (contraseña de aplicación de Gmail; opcional)
name: Project Gina — investigación

on:
  schedule:
    - cron: "17 9 * * 0"   # cada domingo 09:17 UTC — canario (DRY_RUN=1, sin escribir)
    - cron: "17 9 * * 1"   # cada lunes 09:17 UTC — ejecución real
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ejecutar en modo canario (DRY_RUN=1, sin escribir ni abrir PR)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: gina-investigacion
  cancel-in-progress: false

jobs:
  investigar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Construir índice FTS5 de biblioteca de fuentes
        run: python3 datagen/indice_fuentes.py --no-sync

      - name: Configurar git
        run: |
          git config user.name "gina-bot"
          git config user.email "gina-bot@users.noreply.github.com"

      # E1: correos con «[gina:sugerencia]» en el asunto → issues «sugerencia» (sin remitente). No toca el resto del buzón.
      # No corre en el canario del domingo. Si el buzón falla, se avisa pero la investigación sigue.
      - name: Sugerencias por correo → issues
        if: github.event.schedule != '17 9 * * 0' && !inputs.dry_run
        continue-on-error: true
        env:
          GINA_IMAP_USER: ${{ secrets.GINA_IMAP_USER }}
          GINA_IMAP_PASS: ${{ secrets.GINA_IMAP_PASS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node job/correo.js

      - name: Investigar, verificar fuentes y proponer cambios
        env:
          GINA_API_KEY: ${{ secrets.GINA_API_KEY }}
          GINA_SAFEBROWSING_KEY: ${{ secrets.GINA_SAFEBROWSING_KEY }}
          GINA_FACTCHECK_KEY: ${{ secrets.GINA_FACTCHECK_KEY }}
          GINA_URL_CHECK: ${{ vars.GINA_URL_CHECK || 'safebrowsing' }}
          GINA_PROVIDER: ${{ vars.GINA_PROVIDER }}
          GINA_MODEL: ${{ vars.GINA_MODEL }}
          GINA_BASE_URL: ${{ vars.GINA_BASE_URL }}
          GINA_LIMIT: "25"
          GINA_REVALIDATE: ${{ vars.GINA_REVALIDATE || '5' }}
          GINA_REP_LIMIT: ${{ vars.GINA_REP_LIMIT || '0' }}
          GINA_SITIOS: ${{ vars.GINA_SITIOS || '50' }}
          GINA_MAX_SEARCHES: "3"
          GINA_EVERY_DAYS: ${{ vars.GINA_EVERY_DAYS || '6' }}
          GINA_DRY_RUN: ${{ (github.event.schedule == '17 9 * * 0' || inputs.dry_run) && '1' || '' }}
          GINA_FORCE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * 0') && '1' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node job/investigar.js

      - name: Comprobación de seguridad de rutas modificadas
        run: |
          ALLOWED="^(extension/data/brands\.json|datagen/evidencias\.csv|job/estado\.json|job/reportes/|datagen/fuentes/)"
          DISALLOWED=$(git status --porcelain | awk '{print $2}' | grep -vE "$ALLOWED" || true)
          if [ -n "$DISALLOWED" ]; then
            echo "::error::El job modificó archivos no permitidos: $DISALLOWED"
            exit 1
          fi

      # C3: si cualquier paso falla, abrir (o comentar, si ya existe) el issue «Robot de investigación falló».
      - name: Avisar si el robot falló
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Robot de investigación falló"
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          CUERPO="La ejecución del $(date -u +%Y-%m-%d) falló: $RUN_URL"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$CUERPO"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body "$CUERPO"
          fi
