<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gina — Lista de verificación del MVP</title>
<link rel="stylesheet" href="options.css">
<style>
  body { max-width: 820px; margin: 24px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #1c2233; }
  h1 { font-size: 22px; font-weight: 700; color: #1f2a44; margin-bottom: 4px; }
  .lead { font-size: 13.5px; color: #5a6478; margin-bottom: 20px; line-height: 1.45; }
  .actions-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding: 12px 16px; background: #eef2f8; border-radius: 8px; }
  .btn-copy { background: #1f2a44; color: #fff; border: none; padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  .btn-copy:hover { background: #2f3d5e; }
  .sec-card { background: #fff; border: 1px solid #d9dde6; border-radius: 10px; margin-bottom: 18px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  .sec-card h2 { font-size: 16px; font-weight: 700; color: #1f2a44; margin: 0 0 12px; border-bottom: 1px solid #edf0f5; padding-bottom: 8px; }
  .item-row { display: grid; grid-template-columns: 2fr 130px 2fr; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f4f8; font-size: 13px; }
  .item-row:last-child { border-bottom: none; }
  .item-title { font-weight: 600; }
  .item-sub { font-size: 11.5px; color: #5a6478; margin-top: 2px; }
  .item-sub a { color: #1f6fb2; text-decoration: none; }
  .item-sub a:hover { text-decoration: underline; }
  select.status-select { padding: 4px 8px; border-radius: 6px; border: 1px solid #ccd2de; font-size: 12.5px; font-weight: 600; background: #fff; }
  select.status-select.pasa { background: #e6f4ea; color: #137333; border-color: #ceead6; }
  select.status-select.falla { background: #fce8e6; color: #c5221f; border-color: #fad2cf; }
  select.status-select.sin_probar { background: #f1f3f4; color: #5f6368; border-color: #dadce0; }
  input.notes-input { width: 100%; padding: 5px 8px; border: 1px solid #ccd2de; border-radius: 6px; font-size: 12px; box-sizing: border-box; }
  .summary-pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #e1ebfa; color: #143c73; }
  #msgStatus { font-size: 12.5px; font-weight: 600; margin-left: 12px; color: #137333; }
</style>
</head>
<body>

  <h1>Gina — Lista de verificación del MVP (Puerta 1)</h1>
  <p class="lead">Herramienta de auditoría y prueba manual en navegador para registrar el estado de cada tienda, comparador y flujo de la extensión en el mercado mexicano.</p>

  <div class="actions-bar">
    <div id="summaryCounts" class="summary-pill">0 pasados · 0 fallidos · 0 pendientes</div>
    <div>
      <span id="msgStatus"></span>
      <button id="btnCopyMd" class="btn-copy">Copiar resultado como Markdown</button>
    </div>
  </div>

  <main id="checklistRoot"></main>

  <script src="../src/i18n.js"></script>
  <script src="prueba.js"></script>
</body>
</html>
